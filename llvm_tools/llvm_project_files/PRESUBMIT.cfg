[Hook Scripts]
verify patch metadata = ../toolchain-utils/py/bin/llvm_tools/verify_patch_metadata --llvm-dir . ${PRESUBMIT_COMMIT}

[Hook Overrides]
# Disable message style hooks - most commits here are either autogenerated or
# cherry-picks.
check_commit_message_style: False

# Explicitly enable these so they can be customized below.
cros_license_check: True
long_line_check: True

[Hook Overrides Options]
cros_license_check: --exclude_regex=.*
long_line_check: --exclude_regex=.*
